[package]
name = "reforger_language_server"
version = "0.1.0"
edition = "2021"
autoexamples = false

[lib]
name = "reforger_language_server"
path = "src/lib.rs"

[features]
# Enables fault-injection controls used only by spawned MCP integration tests.
# It is deliberately non-default and must never be enabled for a shipped binary.
test-hooks = []

# Developer-only reports and benchmarks live outside this shipped Rust package.
# Explicit targets retain the existing `cargo run --example <name>` workflow.
[[example]]
name = "ast_corpus_report"
path = "../tools/server-reports/ast_corpus_report.rs"

[[example]]
name = "ast_report"
path = "../tools/server-reports/ast_report.rs"

[[example]]
name = "expression_corpus_report"
